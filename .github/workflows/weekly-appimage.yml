name: Weekly Emacs AppImage

on:
  schedule:
    - cron: '17 03 * * 0'
  workflow_dispatch:
    inputs:
      emacs_ref:
        description: Emacs branch, tag, or commit to build
        required: true
        default: master
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: weekly-emacs-appimage
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      EMACS_REF: ${{ inputs.emacs_ref || 'master' }}

    steps:
      - uses: actions/checkout@v4

      - name: Tangle the build files
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends emacs-nox
          emacs --batch --quick --eval '(require (quote org))' \
            --eval '(org-babel-tangle-file "README.org")'

      - name: Build builder image
        run: docker build --tag emacs-appimage-builder -f Containerfile .

      - name: Build Emacs.AppImage
        run: |
          rm -rf .build AppDir dist
          docker run --rm \
            -e EMACS_REF \
            -v "$PWD:/work" emacs-appimage-builder

      - name: Smoke test the launcher names
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 dist/Emacs.AppImage --batch --quick \
            --eval '(princ emacs-version)'
          ln -s Emacs.AppImage dist/emacsclient
          APPIMAGE_EXTRACT_AND_RUN=1 dist/emacsclient --version

      - name: Upload latest AppImage
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: emacs-appimage
          path: |
            dist/Emacs.AppImage
            dist/Emacs.AppImage.sha256
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp=$(date --utc +%Y%m%d-%H%M%S)
          tag="emacs-appimage-${stamp}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="Emacs AppImage ${stamp}"
          gh release create "$tag" \
            dist/Emacs.AppImage \
            dist/Emacs.AppImage.sha256 \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "Automated AppImage build of Emacs ref: \`$EMACS_REF\`."
          echo "tag=$tag" >>"$GITHUB_OUTPUT"

      - name: Prune old releases
        uses: actions/github-script@v7
        with:
          script: |
            const prefix = "emacs-appimage-";
            const releases = (await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            ))
              .filter(release =>
                !release.draft && release.tag_name.startsWith(prefix))
              .sort((a, b) =>
                new Date(b.published_at || b.created_at) -
                new Date(a.published_at || a.created_at));

            // Always retain the four newest successful builds.
            const keep = new Set(releases.slice(0, 4).map(release => release.id));

            // Also retain the newest release in every calendar half-year
            // represented during the rolling 24-month retention window.
            const cutoff = new Date();
            cutoff.setUTCFullYear(cutoff.getUTCFullYear() - 2);
            const retainedHalfYears = new Set();
            for (const release of releases) {
              const published = new Date(release.published_at || release.created_at);
              if (published < cutoff) continue;
              const half = published.getUTCMonth() < 6 ? 1 : 2;
              const bucket = `${published.getUTCFullYear()}-H${half}`;
              if (!retainedHalfYears.has(bucket)) {
                retainedHalfYears.add(bucket);
                keep.add(release.id);
              }
            }

            for (const release of releases) {
              if (keep.has(release.id)) continue;
              core.info(`Deleting release ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

      - name: Remove superseded workflow artifacts
        uses: actions/github-script@v7
        env:
          KEEP_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo,
                name: "emacs-appimage", per_page: 100 },
            );
            for (const artifact of artifacts) {
              if (String(artifact.id) !== process.env.KEEP_ARTIFACT_ID) {
                core.info(`Deleting superseded artifact ${artifact.id}`);
                await github.rest.actions.deleteArtifact({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  artifact_id: artifact.id,
                });
              }
            }
