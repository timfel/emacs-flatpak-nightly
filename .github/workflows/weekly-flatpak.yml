name: Weekly Emacs Flatpak

on:
  schedule:
    # Run on Sunday, away from the busiest top-of-hour schedule window.
    - cron: '17 03 * * 0'
  workflow_dispatch:

# The cleanup step needs to remove superseded workflow artifacts.
permissions:
  contents: read
  actions: write

concurrency:
  group: weekly-emacs-flatpak
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - uses: actions/checkout@v4

      - name: Install tangling and container tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends emacs-nox podman

      - name: Tangle the Flatpak build files
        run: |
          emacs --batch --eval '(require (quote org))' \
            --eval '(org-babel-tangle-file "README.org")'

      - name: Build the Flatpak builder image
        run: podman build --tag emacs-flatpak-builder .

      - name: Build the Flatpak repository
        run: |
          rm -rf build-dir repo dist
          podman run --rm --privileged -v "$PWD:/build:Z" \
            emacs-flatpak-builder \
            flatpak-builder --force-clean --repo=repo build-dir org.gnu.emacs.yaml

      - name: Create distributable bundle
        run: |
          mkdir -p dist
          podman run --rm -v "$PWD:/build:Z" \
            emacs-flatpak-builder \
            flatpak build-bundle \
              --runtime-repo=https://dl.flathub.org/repo/flathub.flatpakrepo \
              /build/repo /build/dist/org.gnu.emacs.flatpak org.gnu.emacs
          sha256sum dist/org.gnu.emacs.flatpak > dist/org.gnu.emacs.flatpak.sha256

      - name: Upload latest Flatpak bundle
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: emacs-flatpak-bundle
          path: dist/
          if-no-files-found: error
          retention-days: 90

      - name: Remove superseded bundle artifacts
        uses: actions/github-script@v7
        env:
          KEEP_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: "emacs-flatpak-bundle",
                per_page: 100,
              },
            );
            const oldArtifacts = artifacts.filter(
              artifact => String(artifact.id) !== process.env.KEEP_ARTIFACT_ID,
            );
            for (const artifact of oldArtifacts) {
              core.info(`Deleting superseded artifact ${artifact.id}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
