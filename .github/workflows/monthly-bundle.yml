name: Monthly Emacs portable bundle

on:
  schedule:
    - cron: '17 03 1 * *'
  workflow_dispatch:
    inputs:
      emacs_ref:
        description: Emacs branch, tag, or commit to build
        required: true
        default: master
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: monthly-emacs-bundle
  cancel-in-progress: false

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            bundle_arch: x86_64
          - runner: ubuntu-24.04-arm
            bundle_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    env:
      EMACS_REF: ${{ inputs.emacs_ref || 'master' }}

    steps:
      - uses: actions/checkout@v7

      - name: Tangle the build files
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends emacs-nox
          emacs --batch --quick --eval '(require (quote org))' \
            --eval '(org-babel-tangle-file "README.org")'

      - name: Build builder image
        run: docker build --tag emacs-portable-builder -f Containerfile .

      - name: Build Emacs portable bundle
        run: |
          rm -rf .build* .prefix* dist*
          docker run --rm \
            -e EMACS_REF \
            -e BUNDLE_ARCH \
            -v "$PWD:/work" emacs-portable-builder
        env:
          BUNDLE_ARCH: ${{ matrix.bundle_arch }}

      - name: Verify on Debian, Ubuntu, and Fedora
        env:
          CONTAINER_ENGINE: docker
        run: .github/scripts/verify-containers.sh dist/Emacs-*.tar.zst

      - name: Upload portable bundle
        uses: actions/upload-artifact@v7
        with:
          name: emacs-portable-bundle-${{ matrix.bundle_arch }}
          path: |
            dist/Emacs-*.tar.zst
            dist/Emacs-*.tar.zst.sha256
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      EMACS_REF: ${{ inputs.emacs_ref || 'master' }}

    steps:
      - uses: actions/checkout@v7

      - name: Download portable bundles
        uses: actions/download-artifact@v8
        with:
          pattern: emacs-portable-bundle-*
          path: dist
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          stamp=$(date --utc +%Y%m%d-%H%M%S)
          tag="emacs-bundle-${stamp}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          title="Emacs portable bundles ${stamp}"
          gh release create "$tag" \
            dist/Emacs-*.tar.zst \
            dist/Emacs-*.tar.zst.sha256 \
            --target "$GITHUB_SHA" \
            --title "$title" \
            --notes "Host-integrated portable Emacs ref \`$EMACS_REF\` for x86_64 and aarch64. Runtime requires host GTK 3 and WebKitGTK 4.1; native compilation uses the included private toolchain."

      - name: Prune old releases
        uses: actions/github-script@v9
        with:
          script: |
            const prefix = "emacs-bundle-";
            const releases = (await github.paginate(
              github.rest.repos.listReleases,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100,
              },
            ))
              .filter(release =>
                !release.draft && release.tag_name.startsWith(prefix))
              .sort((a, b) =>
                new Date(b.published_at || b.created_at) -
                new Date(a.published_at || a.created_at));

            // Always retain the four newest successful builds.
            const keep = new Set(releases.slice(0, 4).map(release => release.id));

            // Also retain the newest release in every calendar half-year
            // represented during the rolling 24-month retention window.
            const cutoff = new Date();
            cutoff.setUTCFullYear(cutoff.getUTCFullYear() - 2);
            const retainedHalfYears = new Set();
            for (const release of releases) {
              const published = new Date(release.published_at || release.created_at);
              if (published < cutoff) continue;
              const half = published.getUTCMonth() < 6 ? 1 : 2;
              const bucket = `${published.getUTCFullYear()}-H${half}`;
              if (!retainedHalfYears.has(bucket)) {
                retainedHalfYears.add(bucket);
                keep.add(release.id);
              }
            }

            for (const release of releases) {
              if (keep.has(release.id)) continue;
              core.info(`Deleting release ${release.tag_name}`);
              await github.rest.repos.deleteRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.id,
              });
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `tags/${release.tag_name}`,
                });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

      - name: Remove superseded workflow artifacts
        uses: actions/github-script@v9
        with:
          script: |
            const artifacts = await github.paginate(
              github.rest.actions.listArtifactsForRepo,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 },
            );
            for (const artifact of artifacts) {
              if (!artifact.name.startsWith("emacs-portable-bundle")) continue;
              if (String(artifact.workflow_run?.id) === String(context.runId)) continue;
              core.info(`Deleting superseded artifact ${artifact.id}`);
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
